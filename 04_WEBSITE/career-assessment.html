<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assessment | Pathora Intelligence</title>
    <link rel="stylesheet" href="career-assessment.css">
</head>
<body>

    <h1>Career Assessment</h1>
    <p>Find suitable career paths based on your education and skills.</p>

    <form id="careerForm">

    <label>Highest Education:</label>
    <select id="education" required>
        <option value="">Select Education</option>
        <option value="UG">Undergraduate Degree</option>
        <option value="PG">Postgraduate Degree</option>
        <option value="Diploma">Diploma</option>
        <option value="12th">12th Standard</option>
    </select>

    <br><br>

    <label>Degree / Course Name:</label>

<select id="degree" required>
    <option value="">Select Degree</option>
    <option value="B.Sc">B.Sc</option>
    <option value="B.Com">B.Com</option>
    <option value="BCA">BCA</option>
    <option value="BBA">BBA</option>
    <option value="BA">BA</option>
    <option value="BE/B.Tech">BE / B.Tech</option>
    <option value="B.Voc">B.Voc</option>
    <option value="M.Sc">M.Sc</option>
    <option value="MCA">MCA</option>
    <option value="MBA">MBA</option>
    <option value="Other">Other</option>
</select>

<br><br>

    <label>Specialization:</label>
<select id="specialization" required>
    <option value="">Select Specialization</option>
    <option value="Computer Science">Computer Science</option>
    <option value="Information Technology">Information Technology</option>
    <option value="Data Science">Data Science</option>
    <option value="Data Analytics">Data Analytics</option>
    <option value="BCA">Computer Applications (BCA)</option>
    <option value="Electronics">Electronics</option>
    <option value="Electrical Engineering">Electrical Engineering</option>
    <option value="Mechanical Engineering">Mechanical Engineering</option>
    <option value="Civil Engineering">Civil Engineering</option>
    <option value="BBA/MBA">Business Administration (BBA/MBA)</option>
    <option value="B.Com">Commerce (B.Com)</option>
    <option value="Mathematics">Mathematics</option>
    <option value="Other">Other</option>
</select>

<br><br>

    <label>Skills:</label>
    <input type="text" id="skills"
           placeholder="Example: Python, SQL, Excel" required>

    <br><br>

    <label>Experience:</label>
    <select id="experience" required>
        <option value="">Select Experience</option>
        <option value="Fresher">Fresher</option>
        <option value="1-2 years">1-2 Years</option>
        <option value="3-5 years">3-5 Years</option>
        <option value="5+ years">Above 5 Years</option>
    </select>

    <br><br>

    <label>Interested Career Field:</label>
    <select id="interest">
        <option value="">Not Sure Yet - Show All Suitable Careers</option>
        <option value="Data Analytics">Data Analytics</option>
        <option value="Software Development">Software Development</option>
        <option value="Web Development">Web Development</option>
        <option value="Digital Marketing">Digital Marketing</option>
    </select>

    <br><br>

    <button type="submit">Assess My Career</button>

</form>

<div id="result"></div>

<script>
document.getElementById("careerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let education = document.getElementById("education").value;
    let degree = document.getElementById("degree").value;
    let specialization = document.getElementById("specialization").value;
    let skillsInput = document.getElementById("skills").value;
    let experience = document.getElementById("experience").value;
    let interest = document.getElementById("interest").value;

    let skills = skillsInput.toLowerCase().split(",").map(skill => skill.trim());

    let careers = {
    "Data Analytics": {
        "Data Analyst": ["excel", "sql", "python", "power bi", "tableau"],
        "BI Analyst": ["excel", "sql", "power bi", "tableau"],
        "MIS Executive": ["excel", "sql", "reporting"],
        "Reporting Analyst": ["excel", "sql", "power bi"],
        "Business Analyst": ["excel", "sql", "communication"],
        "SQL Analyst": ["sql", "database", "excel"],
        "Junior Data Scientist": ["python", "sql", "statistics", "machine learning"],
        "Data Engineer": ["python", "sql", "database", "etl"]
    },

    "Software Development": {
        "Python Developer": ["python", "programming", "django"],
        "Java Developer": ["java", "programming", "oops"],
        "Software Tester": ["testing", "manual testing", "selenium"]
    },

    "Web Development": {
        "Frontend Developer": ["html", "css", "javascript"],
        "Backend Developer": ["python", "javascript", "sql"],
        "Full Stack Developer": ["html", "css", "javascript", "python"]
    },

    "Digital Marketing": {
        "SEO Analyst": ["seo", "keyword research", "google analytics"],
        "Digital Marketing Executive": ["seo", "content marketing", "social media"],
        "Social Media Executive": ["social media", "content creation", "analytics"]
    }
};

let specializationFields = {
    "Computer Science": [
        "Data Analytics",
        "Software Development",
        "Web Development"
    ],

    "Information Technology": [
        "Data Analytics",
        "Software Development",
        "Web Development"
    ],

    "Data Science": [
        "Data Analytics"
    ],

    "Data Analytics": [
        "Data Analytics"
    ],

    "BCA": [
        "Software Development",
        "Web Development",
        "Data Analytics"
    ],

    "Electronics": [
        "Software Development"
    ],

    "Electrical Engineering": [
        "Software Development"
    ],

    "Mechanical Engineering": [
        "Data Analytics"
    ],

    "Civil Engineering": [
        "Data Analytics"
    ],

    "BBA/MBA": [
        "Data Analytics",
        "Digital Marketing"
    ],

    "B.Com": [
        "Data Analytics",
        "Digital Marketing"
    ],

    "Mathematics": [
        "Data Analytics"
    ]
};

    let results = [];

let matchedFields = specializationFields[specialization] || [];

// If the user selects an interested field, filter by that field
if (interest !== "") {
    matchedFields = matchedFields.includes(interest)
        ? [interest]
        : [];
}

for (let field of matchedFields) {

    let selectedCareers = careers[field];

    for (let role in selectedCareers) {

        let requiredSkills = selectedCareers[role];

        let matchedSkills = requiredSkills.filter(skill =>
            skills.includes(skill)
        );

        
            results.push({
                role: role,
                matched: matchedSkills,
                missing: requiredSkills.filter(skill =>
                    !skills.includes(skill)
                ),
                percentage: Math.round(
                    (matchedSkills.length / requiredSkills.length) * 100
                )
            });
        
    }
}

    let output = document.getElementById("result");

    if (results.length === 0) {
        output.innerHTML = "<h2>No matching roles found</h2><p>Try entering more skills.</p>";
        return;
    }

    output.innerHTML = "<h2>Career Assessment Results</h2>";

    results.sort((a, b) => b.percentage - a.percentage);

    results.forEach(item => {

    let readiness = "";

    if (item.percentage >= 80) {
        readiness = "Strong Skill Match";
    } 
    else if (item.percentage >= 50) {
        readiness = "Developing Skills";
    } 
    else {
        readiness = "Needs More Learning";
    }

    output.innerHTML += `
        <div class="career-result">

            <h3>${item.role}</h3>

            <p><strong>Skill Match:</strong> ${item.percentage}%</p>

            <p><strong>Career Readiness:</strong> ${readiness}</p>

            <p><strong>Matching Skills:</strong>
                ${item.matched.length > 0
                    ? item.matched.join(", ")
                    : "No matching skills yet"}
            </p>

            <p><strong>Missing Skills:</strong>
                ${item.missing.length > 0
                    ? item.missing.join(", ")
                    : "No missing skills"}
            </p>

            <p><strong>Recommended Skills to Learn:</strong>
                ${item.missing.length > 0
                    ? item.missing.join(", ")
                    : "Keep improving your skills"}
            </p>

            <hr>

        </div>
    `;
});

    output.innerHTML += "<p><small>These are preliminary skill matches, not guaranteed job recommendations.</small></p>";
});
</script>

</body>
</html>
